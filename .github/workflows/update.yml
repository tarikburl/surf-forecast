name: update

on:
  schedule:
    # Three updates a day: about 5 AM, 11 AM and 5 PM Pacific (cron is UTC, so
    # these land an hour later in summer). GitHub sometimes drops a scheduled
    # run, so each has one backup 40 minutes later.
    - cron: "17 1,13,19 * * *"
    - cron: "57 1,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit the daily forecast history
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - run: pytest -q

      # The database carries over between runs so a failed source falls back
      # to the last stored data. If the cache is ever lost, the next run
      # simply refetches everything.
      - uses: actions/cache@v4
        with:
          path: data/surf.db
          key: surf-db-${{ github.run_id }}
          restore-keys: surf-db-

      - name: Fetch
        run: surf fetch || echo "::warning::some sources failed; using stored data"
      - name: Build page
        run: surf page

      - name: Save today's forecast (first run of each UTC day)
        run: |
          f="history/$(date -u +%F).csv"
          if [ ! -f "$f" ]; then
            mkdir -p history
            sqlite3 -header -csv data/surf.db \
              "SELECT * FROM forecast WHERE run = date('now') ORDER BY spot, time" > "$f"
            if [ -s "$f" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$f"
              git commit -m "Forecast history $(date -u +%F)"
              git push
            else
              rm -f "$f"
            fi
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
